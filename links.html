<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FLOWZ - Links</title>
  
  <link rel="icon" type="image/png" href="assets/favicon.png"/>
  <link rel="shortcut icon" href="assets/favicon.png"/>
  
  <style>
    @font-face { font-family: 'Anton'; font-style: normal; font-weight: 400; font-display: swap; src: url('fonts/anton-v25-latin-regular.woff2') format('woff2'); }
    @font-face { font-family: 'Inter'; font-style: normal; font-weight: 300; font-display: swap; src: url('fonts/inter-v18-latin-300.woff2') format('woff2'); }
    @font-face { font-family: 'Inter'; font-style: normal; font-weight: 400; font-display: swap; src: url('fonts/inter-v18-latin-regular.woff2') format('woff2'); }
    @font-face { font-family: 'Inter'; font-style: normal; font-weight: 500; font-display: swap; src: url('fonts/inter-v18-latin-500.woff2') format('woff2'); }
    @font-face { font-family: 'Inter'; font-style: normal; font-weight: 600; font-display: swap; src: url('fonts/inter-v18-latin-600.woff2') format('woff2'); }

    :root {
      --bg: #f2f0eb;
      --dark: #0d0d0d;
      --red: #e3150d;
      --muted: #888;
      --border: #d8d5cf;
      --surface: #ffffff;
    }
    
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    
    body { 
      background: var(--bg); 
      color: var(--dark); 
      font-family: 'Inter', sans-serif; 
      font-size: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 3rem 1.25rem;
    }

    .container {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 0.5rem;
    }
    
    .profile-img {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 1.25rem;
      border: 1px solid var(--border);
    }

    .profile-logo {
      display: block;
      height: 42px;
      width: auto;
      max-width: 100%;
      object-fit: contain;
      margin-bottom: 0.5rem;
      filter: brightness(0);
    }

    .subtitle { font-size: 0.95rem; font-weight: 400; color: var(--dark); }

    .section-title {
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 1rem;
      color: var(--dark);
    }

    .block-group { display: flex; flex-direction: column; gap: 0.75rem; }

    .card {
      display: flex;
      align-items: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      text-decoration: none;
      color: var(--dark);
      padding: 1rem 1.25rem;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
      position: relative;
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: var(--red);
      box-shadow: 0 4px 12px rgba(13, 13, 13, 0.05);
    }

    .card-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      margin-right: 1rem;
      flex-shrink: 0;
    }

    .card-icon svg { width: 28px; height: 28px; fill: none; stroke: var(--dark); stroke-width: 1.75; }
    .card-cover { width: 48px; height: 48px; border-radius: 6px; object-fit: cover; margin-right: 1rem; flex-shrink: 0; }

    .card-text {
      flex: 1;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding-right: 1.5rem;
    }

    .card-title { font-family: 'Inter', sans-serif; font-weight: 400; font-size: 1rem; line-height: 1.4; }
    .card-dots { position: absolute; right: 1.25rem; display: flex; flex-direction: column; gap: 3px; }
    .card-dots span { width: 3px; height: 3px; background: var(--border); border-radius: 50%; }
    .card:hover .card-dots span { background: var(--muted); }
    .booking-card .card-title { font-weight: 500; }

    footer {
      text-align: center;
      margin-top: 3rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
      width: 100%;
    }
    footer p, footer a, footer button { font-size: 0.7rem; color: var(--muted); text-decoration: none; }
    footer button { background: none; border: none; cursor: pointer; font-family: inherit; padding: 0; }
    footer a:hover, footer button:hover { color: var(--red); }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <img src="assets/og-share.jpg" alt="FLOWZ" class="profile-img"/>
      <img src="assets/logo.png" alt="FLOWZ" class="profile-logo"/>
      <div class="subtitle">Drum & Bass Artist from Cologne, Germany</div>
    </header>

    <!-- Der Container für die dynamischen Daten -->
    <main id="linksContainer"></main>

    <footer>
      <p>© 2026 FLOWZ</p>
      <p style="margin-top: 0.4rem;">
        <button onclick="window.reopenCookieBanner()">Cookie-Einstellungen</button> · 
        <a href="https://iamflowz.de/impressum">Impressum</a> · 
        <a href="https://iamflowz.de/datenschutz">Datenschutz</a>
      </p>
    </footer>
  </div>

  <script src="js/cookie-banner.js"></script>
  <script>
    const mailIconSvg = `<svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><path d="m22 6-10 7L2 6"/></svg>`;

    async function loadLinks() {
      try {
        const response = await fetch('data/links.json?v=' + Date.now());
        const sections = await response.json();
        const container = document.getElementById('linksContainer');
        container.innerHTML = '';

        sections.forEach(sec => {
          const sectionEl = document.createElement('section');
          sectionEl.style.marginBottom = '2rem';
          
          let html = `<div class="section-title">${sec.title}</div><div class="block-group">`;
          
          sec.links.forEach(link => {
            const isBooking = sec.title.toLowerCase().includes('booking');
            const targetAttr = link.target ? `target="${link.target}" rel="noopener noreferrer"` : '';
            
            let iconOrImage = '';
            if (link.image) {
              iconOrImage = `<img src="${link.image}" alt="${link.title}" class="card-cover"/>`;
            } else if (link.icon === 'mail') {
              iconOrImage = `<div class="card-icon">${mailIconSvg}</div>`;
            }

            html += `
              <a href="${link.url}" ${targetAttr} class="card ${isBooking ? 'booking-card' : ''}">
                ${iconOrImage}
                <div class="card-text">
                  <div class="card-title">${link.title}</div>
                </div>
                <div class="card-dots"><span></span><span></span><span></span></div>
              </a>
            `;
          });

          html += `</div>`;
          sectionEl.innerHTML = html;
          container.appendChild(sectionEl);
        });
      } catch (e) {
        console.error('Fehler beim Laden der Links:', e);
      }
    }

    loadLinks();
  </script>
</body>
</html>
